name: CaloBridge3 — etape 5.2 Sante Connect (debug)

on:
  workflow_dispatch:
  push:
    paths:
      - 'calobridge3-health52-source.zip'
      - '.github/workflows/build-health-read-5_2.yml'

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Charger le depot
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK API 36
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - name: Gradle 8.14.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.5'
      - name: Extraire et controler les sources
        shell: bash
        run: |
          set -euo pipefail
          test -s calobridge3-health52-source.zip
          mkdir -p "$RUNNER_TEMP/CaloBridge3" release-report
          unzip -q calobridge3-health52-source.zip -d "$RUNNER_TEMP/CaloBridge3"
          test -f "$RUNNER_TEMP/CaloBridge3/settings.gradle.kts"
          test -f "$RUNNER_TEMP/CaloBridge3/app/src/main/AndroidManifest.xml"
          unzip -t calobridge3-health52-source.zip | tail -2 | tee release-report/archive-source.txt
          sha256sum calobridge3-health52-source.zip | tee release-report/sha256-source.txt
      - name: Tests unitaires et APK debug
        shell: bash
        run: |
          set -o pipefail
          gradle -p "$RUNNER_TEMP/CaloBridge3" :app:testDebugUnitTest :app:assembleDebug --no-daemon --console=plain \
            2>&1 | tee release-report/gradle-build.txt
      - name: Controle de la signature et du package
        shell: bash
        run: |
          set -euo pipefail
          APK="$RUNNER_TEMP/CaloBridge3/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK" | tee release-report/signature.txt
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | tee release-report/application.txt
          grep -q "name='com.caloflow.calobridge3'" release-report/application.txt
          grep -q "versionCode='2'" release-report/application.txt
          mkdir -p release-apk
          cp "$APK" release-apk/CaloBridge3-ETAPE5_2-SANTE-CONNECT-debug.apk
          sha256sum release-apk/*.apk | tee release-report/sha256-apk.txt
      - name: Publier APK telechargeable
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: CaloBridge3-ETAPE5_2-APK
          path: release-apk/
          retention-days: 7
          if-no-files-found: error
      - name: Publier rapport et tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CaloBridge3-ETAPE5_2-RAPPORT
          path: |
            release-report/
            ${{ runner.temp }}/CaloBridge3/app/build/test-results/testDebugUnitTest/
          retention-days: 7
          if-no-files-found: warn
