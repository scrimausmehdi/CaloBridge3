name: CaloBridge3 - Compilateur et APK de liaison (test)

on:
  push:
    paths:
      - 'calobridge3-source.zip'
      - '.github/workflows/build-calobridge3-linktest.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-linktest:
    name: Compiler APK de liaison sans Health Connect
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Charger le depot
        uses: actions/checkout@v4

      - name: Configurer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurer Android SDK API 36
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Configurer Gradle 8.14.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.5'

      - name: Verifier et extraire les sources
        shell: bash
        run: |
          set -euo pipefail
          test -f calobridge3-source.zip
          mkdir -p "$RUNNER_TEMP/Calobridge3" release-report
          unzip -q calobridge3-source.zip -d "$RUNNER_TEMP/Calobridge3"
          test -f "$RUNNER_TEMP/Calobridge3/settings.gradle.kts"
          test -f "$RUNNER_TEMP/Calobridge3/app/src/main/AndroidManifest.xml"
          unzip -t calobridge3-source.zip | tail -n 2 | tee release-report/archive-source.txt
          sha256sum calobridge3-source.zip | tee release-report/sha256-source.txt

      - name: Tests unitaires Kotlin puis compilation APK debug
        shell: bash
        run: |
          set -euo pipefail
          gradle -p "$RUNNER_TEMP/Calobridge3" \
            :app:testDebugUnitTest :app:assembleDebug \
            --no-daemon --console=plain 2>&1 | tee release-report/gradle-build.txt

      - name: Verifier APK signe et identite
        shell: bash
        run: |
          set -euo pipefail
          APK="$RUNNER_TEMP/Calobridge3/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "$SDK"
          "$SDK/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK" \
            | tee release-report/signature.txt
          "$SDK/build-tools/36.0.0/aapt" dump badging "$APK" \
            | tee release-report/application.txt
          grep -q "name='com.caloflow.calobridge3'" release-report/application.txt
          sha256sum "$APK" | tee release-report/sha256-apk.txt
          mkdir -p release-apk
          cp "$APK" release-apk/CaloBridge3-LIAISON-TEST-debug.apk
          cp release-report/sha256-apk.txt release-apk/
          cp release-report/signature.txt release-apk/
          cp release-report/application.txt release-apk/

      - name: Publier APK telechargeable
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: CaloBridge3-LIAISON-TEST-APK
          path: release-apk/
          retention-days: 7
          if-no-files-found: error

      - name: Publier rapport de compilation et tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CaloBridge3-LIAISON-TEST-REPORT
          path: |
            release-report/
            ${{ runner.temp }}/Calobridge3/app/build/test-results/testDebugUnitTest/
          retention-days: 7
          if-no-files-found: warn
